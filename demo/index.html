<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>LUMA — демо-сайты</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #F3F4F7; color: #14161C;
         font: 17px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; padding: 16px; box-sizing: border-box; }
  .card { max-width: 440px; background: #fff; border-radius: 20px; padding: 32px; box-shadow: 0 20px 50px -30px rgba(20,22,28,.4); }
  h1 { font-size: 22px; margin: 0 0 10px; }
  p { margin: 0; color: #646A78; }
</style>
</head>
<body>
  <div class="card">
    <h1 id="t">Готово</h1>
    <p id="p">В этом браузере ваши просмотры демо-сайтов больше не будут приходить в бота как «клиент открыл демо». Откройте эту страницу так же на телефоне и в других браузерах, где смотрите демо.</p>
  </div>
<script>
  try { localStorage.setItem("luma_owner", "1"); }
  catch (e) {
    document.getElementById("t").textContent = "Не получилось";
    document.getElementById("p").textContent = "Браузер не разрешает сохранить метку (приватный режим?). Откройте страницу в обычном окне.";
  }
</script>
</body>
</html>
